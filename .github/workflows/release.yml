name: 릴리스 태그 달기

# 킷 버전을 끊는다. 태그를 직접 push 할 수 없는 환경(사내 git 프록시 등)이
# 있어서, Actions 탭에서 눌러 태그와 릴리스를 만든다.
#
#   Actions → 릴리스 태그 달기 → Run workflow → tag 에 v1.1.0 입력
#
# 서비스(teach-lab · sense-lab 등)는 이 태그 번호로 킷을 고정해 가져간다.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '태그 (예: v1.1.0). CHANGELOG.md 에 같은 번호의 절이 있어야 본문이 채워진다'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: CHANGELOG 에서 릴리스 본문 뽑기
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # "## vX.Y.Z — 날짜" 절만 잘라 쓴다. 없으면 본문 없이 만든다.
          awk -v tag="$TAG" '
            /^## / { on = ($2 == tag) ; next }
            on     { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 에 $TAG 절이 없습니다 — 본문 없이 릴리스합니다"
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: notes.md
